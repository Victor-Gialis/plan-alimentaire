<style>
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--fill:#f2f2f7;--blue:#0071e3;--P:#0a84ff;--C:#ff9f0a;--L:#ff375f;--glass:rgba(245,245,247,.78)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#38383a;--fill:#2c2c2e;--blue:#2997ff;--glass:rgba(0,0,0,.72)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#38383a;--fill:#2c2c2e;--blue:#2997ff;--glass:rgba(0,0,0,.72)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ios{height:38px;border-radius:19px;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:linear-gradient(to right,var(--blue) var(--pct,0%),var(--fill) var(--pct,0%))}
.brand{max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 36px) 16px 20px;text-align:center}
.brand svg{width:68px;height:68px;filter:drop-shadow(0 8px 16px rgba(10,132,255,.28))}
.brand p{margin:14px auto 0;font-size:clamp(24px,5vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.1;max-width:520px}
.brand span{display:block;margin-top:8px;color:var(--mute);font-size:15px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.chip{border:0;background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:6px 16px;border-radius:999px;cursor:pointer;box-shadow:0 0 0 1px var(--line)}.chip.on{background:var(--ink);color:var(--bg)}
.c{display:contents}.c small{display:none}.ch{width:100%;height:auto;display:block}
@media(max-width:640px){.sc .fr{min-width:0;grid-template-columns:repeat(4,1fr);row-gap:8px}.fh{display:none!important}.sc .fr>:nth-child(1){grid-column:1/4}.sc .fr>:nth-child(8){grid-column:4;grid-row:1;justify-self:end}.c{display:flex;flex-direction:column;gap:2px}.c small{display:block;font-size:11px;color:var(--mute)}.fr b{text-align:left}}
.fcard{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;cursor:pointer}.fcard:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}.fcard b{display:block;font-size:16px;font-weight:600}.fcard small{display:block;color:var(--mute);font-size:13px}.mm{display:flex;gap:12px;font-weight:600;font-size:15px}.mm i{font-style:normal}
nav{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
nav div{max-width:820px;margin:0 auto;display:flex;justify-content:center;gap:4px;padding:8px 12px}
nav a{padding:6px 16px;border-radius:999px;color:var(--mute);text-decoration:none;font-size:14px;font-weight:500;transition:.2s}
nav a.on{background:var(--ink);color:var(--bg)}
main{max-width:820px;margin:0 auto;padding:32px 16px 80px}
h1{font-size:clamp(34px,7vw,52px);line-height:1.05;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}
.lead{font-size:19px;color:var(--mute);margin:0 0 32px;max-width:560px}
h3{font-size:13px;font-weight:600;color:var(--mute);margin:28px 0 8px 16px;letter-spacing:.01em}
.card{background:var(--card);border-radius:20px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:28px}
.item+.item{border-top:1px solid var(--line)}
.item input,.item select{border:0;background:transparent;color:var(--blue);font:inherit;text-align:right;min-width:0;width:100%;max-width:200px;padding:4px 0;-webkit-appearance:none;appearance:none}
.item select{direction:rtl}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:5px 16px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.btn{border:0;background:var(--blue);color:#fff;font:inherit;font-weight:500;padding:11px 22px;border-radius:999px;cursor:pointer}
.btn.s{background:var(--fill);color:var(--blue)}
.btn.t{background:transparent;color:var(--blue);padding:6px 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero{padding:32px 24px;text-align:center}
.hero .n{font-size:clamp(64px,16vw,104px);font-weight:700;letter-spacing:-.04em;line-height:1}
.hero .u{font-size:20px;color:var(--mute);font-weight:500}
.macros{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;border-top:1px solid var(--line)}
.macros div{padding:18px 8px 0;font-size:13px;color:var(--mute)}
.macros b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em}
.note{font-size:13px;color:var(--mute);margin:12px 16px 0}.w{color:#ff9500;font-weight:600}
.sum{display:flex;gap:24px;align-items:center;padding:24px;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mute)}
.ring b{font-size:26px;color:var(--ink);letter-spacing:-.02em}
.bars{flex:1;min-width:200px;display:grid;gap:14px}
.bar span{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}.bar b{color:var(--ink);font-weight:600}
.tr{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}.tr i{display:block;height:100%;border-radius:4px;transition:width .4s}
.banner{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:16px;font-size:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.mh input{font:inherit;font-weight:600;font-size:18px;border:0;background:transparent;color:var(--ink);min-width:0;flex:1}
.ml{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;padding:8px 16px}
.ml select,.ml input{font:inherit;background:var(--fill);border:0;border-radius:8px;padding:7px 10px;color:var(--ink);min-width:0}
.ml small{grid-column:1/3;color:var(--mute);font-size:12px;margin-top:-4px}
.mt{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px 14px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);margin-top:6px}.mt b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.sg{padding:16px;font-size:14px}.sg div{padding:6px 0}
.fr{display:grid;grid-template-columns:minmax(120px,1.5fr) minmax(64px,.7fr) 64px 64px 64px 64px 52px 28px;gap:6px;align-items:center;padding:8px 16px}
.fr+.fr{border-top:1px solid var(--line)}
.fr input,.fr select{font:inherit;font-size:14px;background:var(--fill);border:0;border-radius:7px;padding:6px 8px;color:var(--ink);min-width:0;width:100%}
.fh{font-size:12px;color:var(--mute);font-weight:600}.fr b{font-size:14px}
.fr .x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.sc{overflow-x:auto}.fr input.mP,.fh .hP{color:var(--P)}.fr input.mC,.fh .hC{color:var(--C)}.fr input.mL,.fh .hL{color:var(--L)}.fr input.mP,.fr input.mC,.fr input.mL{font-weight:600;box-shadow:inset 0 -2px 0 currentColor}.fr b{text-align:right}.sc .fr{min-width:700px}
</style>
</head>
<body>
<header class="brand"><svg viewBox="0 0 64 64" role="img" aria-label="Logo : une pomme coupée au couteau dans une assiette, avec une fourchette"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#30d5c8"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><ellipse cx="32" cy="50" rx="25" ry="7" fill="#fff"/><ellipse cx="32" cy="49" rx="18" ry="4.5" fill="#dbe9ff"/><circle cx="29" cy="38" r="11" fill="#ff375f"/><path d="M22 34q1-4 5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".6"/><path d="M29 28q0-5 2-7" fill="none" stroke="#7a4a2b" stroke-width="1.8" stroke-linecap="round"/><path d="M31 24c1-4 5-5 8-4-1 4-4 5-8 4z" fill="#34c759"/><path d="M42 48q1-9 9-11-1 9-9 11z" fill="#fff1b8" stroke="#ff375f" stroke-width="2" stroke-linejoin="round"/><path d="M49 11l3 3-15 18-3-2z" fill="#f2f2f7"/><path d="M49 11l6-6" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 22v8M13 22v8M17 22v8"/><path d="M9 30q4 5 8 0"/><path d="M13 34v18" stroke-width="2.8"/></g></svg><p>Ton assiette, enfin faite pour toi.</p><span>Calcule tes besoins, compose tes repas, atteins ton objectif.</span><div class="chips" id="chips"></div></header>
<nav><div><a href="#profil" data-pg="profil">Profil</a><a href="#repas" data-pg="repas">Repas</a><a href="#suivi" data-pg="suivi">Suivi</a><a href="#aliments" data-pg="aliments">Aliments</a></div></nav>
<main id="app"></main>
<input type="file" id="imp" accept=".json,application/json" hidden>
<script>
const KEY="plan-alim-v2",CATS=["Protéines","Féculents","Laitiers","Petit-déj","Autres"];
const DEF={p:{sex:"f",age:30,w:65,h:165,act:1.375,tw:60,wk:12,prot:1.6,def:10},seed:0,planKcal:0,
foods:[["Œuf","unité",1,6.3,.5,5,"Petit-déj"],["Fromage blanc 0%","g",100,8,4.5,.5,"Laitiers"],["Tranche de pain","unité",1,3,14,1,"Féculents"],["Wrap complet","unité",1,5,28,3.5,"Féculents"],["Viande","g",100,25,0,10,"Protéines"],["Poisson","g",100,22,0,6,"Protéines"],["Fromage","g",30,7,1,9,"Laitiers"],["Pâtes complètes","g",100,5,27,1,"Féculents"],["Riz complet","g",100,3,28,1,"Féculents"],["Miel","cuillère",1,0,6,0,"Autres"]].map(a=>({n:a[0],u:a[1],q:a[2],P:a[3],C:a[4],L:a[5],cat:a[6]})),meals:[]};
let openFood=null;const clone=o=>JSON.parse(JSON.stringify(o));
let R=null;try{R=JSON.parse(localStorage.getItem("plan-alim-v3"))}catch(e){}
if(!R||!Array.isArray(R.list)||!R.list.length){let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 R={cur:"p1",list:[{id:"p1",name:"Moi",S:(old&&old.p)?old:clone(DEF)}]}}
let S;const cur=()=>R.list.find(z=>z.id===R.cur);
const setCur=id=>{openFood=null;const x=R.list.find(z=>z.id===id)||R.list[0];R.cur=x.id;S=x.S;if(S.p.def==null)S.p.def=10};
setCur(R.cur);
const save=()=>{try{localStorage.setItem("plan-alim-v3",JSON.stringify(R))}catch(e){}};
const r=(x,d=0)=>(+x).toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const find=n=>S.foods.find(f=>f.n===n),kc=f=>f.P*4+f.C*4+f.L*9;

function target(){
 const p=S.p,m=p.sex==="m",msg=[];
 const bmr=10*p.w+6.25*p.h-5*p.age+(m?5:-161),tdee=bmr*p.act;
 const raw=(p.tw-p.w)*7700/(Math.max(1,p.wk)*7),mx=tdee*Math.min(20,Math.max(10,p.def||10))/100;
 const d=Math.max(-mx,Math.min(tdee*.12,raw));let kcal=tdee+d;const fl=m?1500:1200;
 if(kcal<fl){kcal=fl;msg.push("Le minimum de sécurité ("+fl+" kcal) s'applique.")}
 if(Math.abs(raw-d)>1)msg.push("Cet objectif est ambitieux pour "+p.wk+" semaines : le rythme est plafonné, l'objectif prendra donc plus de temps.");
 const real=kcal-tdee,weeks=Math.abs(real)<5?null:Math.abs((p.tw-p.w)*7700/real/7);
 const P=p.prot*p.w,L=.28*kcal/9,C=Math.max(0,(kcal-P*4-L*9)/4);
 return{bmr,tdee,kcal,P,C,L,msg,weeks};
}
const mealTot=m=>{const t={P:0,C:0,L:0,k:0};m.i.forEach(([n,a])=>{const f=find(n);if(!f)return;const x=a/f.q;t.P+=f.P*x;t.C+=f.C*x;t.L+=f.L*x});t.k=t.P*4+t.C*4+t.L*9;return t};
const dayTot=()=>{const t={P:0,C:0,L:0,k:0};S.meals.forEach(m=>{const x=mealTot(m);for(const k in t)t[k]+=x[k]});return t};

const guess=f=>!(f.P||f.C||f.L)?"Autres":(f.C>f.P&&f.C*4>f.L*9?"Féculents":"Protéines");
function auto(){
 const t=target(),by=c=>S.foods.filter(f=>f.cat===c);S.seed++;
 const tpl=[["Petit-déjeuner",.25,["Laitiers","Petit-déj","Féculents"]],["Déjeuner",.32,["Protéines","Féculents"]],["Collation",.08,["Laitiers","Autres"]],["Dîner",.35,["Protéines","Féculents"]]];
 S.meals=tpl.map(([n,sh,cats],ti)=>{
  const its=[];cats.forEach(c=>{const l=by(c);if(l.length)its.push({f:l[(S.seed+(ti===3?1:0))%l.length],a:0})});
  its.forEach(o=>o.a=o.f.q);
  const T={P:sh*t.P||1,C:sh*t.C||1,L:sh*t.L||1};
  const cost=()=>{const s={P:0,C:0,L:0};its.forEach(o=>{const x=o.a/o.f.q;s.P+=o.f.P*x;s.C+=o.f.C*x;s.L+=o.f.L*x});return["P","C","L"].reduce((z,k)=>z+Math.pow((s[k]-T[k])/T[k],2),0)};
  for(let k=0;k<400;k++){let ch=false;its.forEach(o=>{const st=o.f.u==="g"?5:.5;[st,-st].forEach(d=>{const b=cost(),old=o.a,na=old+d;if(na<0||na>6*o.f.q)return;o.a=na;if(cost()<b-1e-9)ch=true;else o.a=old})});if(!ch)break}
  return{n,i:its.filter(o=>o.a>0).map(o=>[o.f.n,o.a])};
 });
 S.planKcal=Math.round(t.kcal);save();
}
if(!S.meals.length)auto();

function seg(k,opts,val){return`<div class="seg">${opts.map(([v,l])=>`<button data-seg="${k}" data-v="${v}" class="${v==val?"on":""}">${l}</button>`).join("")}</div>`}
function pageProfil(){
 const p=S.p,t=target();
 const num=(k,l,u,st)=>`<div class="item"><label for="p_${k}">${l}</label><span style="display:flex;gap:4px;align-items:center"><input id="p_${k}" type="number" inputmode="decimal" step="${st||1}" data-p="${k}" value="${p[k]}" style="width:80px"><span style="color:var(--mute)">${u}</span></span></div>`;
 return`<h1>Mon profil</h1><p class="lead">Quelques informations pour calculer ce dont ton corps a besoin chaque jour.</p>
 <div class="card hero"><div class="n">${r(t.kcal)}</div><div class="u">kcal par jour</div>
 <div class="macros"><div><b style="color:var(--P)">${r(t.P)} g</b>Protéines</div><div><b style="color:var(--C)">${r(t.C)} g</b>Glucides</div><div><b style="color:var(--L)">${r(t.L)} g</b>Lipides</div></div></div>
 <p class="note">Métabolisme de base ≈ ${r(t.bmr)} kcal, dépense totale ≈ ${r(t.tdee)} kcal/jour.${t.weeks?" Il faut environ "+r(t.weeks)+" semaines pour atteindre ton poids visé.":""} ${t.msg.map(m=>`<span class="w">${m}</span>`).join(" ")}</p>
 <h3>Moi</h3><div class="card"><div class="item"><span>Sexe</span>${seg("sex",[["f","Femme"],["m","Homme"]],p.sex)}</div>${num("age","Âge","ans")}${num("h","Taille","cm")}${num("w","Poids actuel","kg",.1)}
 <div class="item"><label for="p_act">Activité physique</label><select id="p_act" data-p="act">${[[1.2,"Sédentaire"],[1.375,"Légère · 1 à 3 séances"],[1.55,"Modérée · 3 à 5 séances"],[1.725,"Intense · 6 à 7 séances"]].map(a=>`<option value="${a[0]}"${+p.act===a[0]?" selected":""}>${a[1]}</option>`).join("")}</select></div></div>
 <h3>Mon objectif</h3><div class="card">${num("tw","Poids visé","kg",.1)}${num("wk","Délai","semaines")}${num("prot","Protéines","g / kg",.1)}<div class="item" style="flex-direction:column;align-items:stretch;gap:12px"><div style="display:flex;justify-content:space-between"><label for="p_def">Déficit maximum</label><b id="defv">${p.def} %</b></div><div class="ios" id="p_def" role="slider" tabindex="0" aria-label="Déficit maximum" aria-valuemin="10" aria-valuemax="20" aria-valuenow="${p.def}" style="--pct:${(p.def-10)*10}%"></div></div></div>
 <p class="note">Les protéines entretiennent les muscles, les glucides donnent l'énergie, les lipides aident les hormones et les vitamines. Ici : lipides à 28 % des calories, glucides pour le reste. Ces calculs sont des estimations : en cas de pathologie ou de doute, demande l'avis d'un médecin ou d'un diététicien.</p>
 <h3>Profils et données</h3><div class="card"><div class="item"><label for="p_name">Nom du profil</label><input id="p_name" data-pname value="${esc(cur().name)}"></div>
 <div class="item"><span>Exporter tous mes profils</span><button class="btn t" data-act="export">Exporter</button></div>
 <div class="item"><span>Importer un fichier</span><button class="btn t" data-act="import">Choisir…</button></div>
 <div class="item"><span>Supprimer ce profil</span><button class="btn t" style="color:#ff3b30" data-act="delProfile"${R.list.length<2?" disabled":""}>Supprimer</button></div></div>
 <p class="note">Les profils sont enregistrés sur cet appareil. Pour les retrouver ailleurs, exporte un fichier puis importe-le sur l'autre appareil.</p>
 <div class="row"><a class="btn" href="#repas" style="text-decoration:none">Voir mes repas</a></div>`;
}
function pageRepas(){
 const t=target(),d=dayTot(),pc=Math.min(100,d.k/t.kcal*100),C=2*Math.PI*58;
 const bars=[["Protéines","P",t.P,"var(--P)"],["Glucides","C",t.C,"var(--C)"],["Lipides","L",t.L,"var(--L)"]];
 const df={P:t.P-d.P,C:t.C-d.C,L:t.L-d.L},T={P:t.P||1,C:t.C||1,L:t.L||1};
 const cost=x=>["P","C","L"].reduce((s,k)=>s+Math.pow(x[k]/T[k],2),0),bf=cost(df),out=[];
 S.foods.forEach(f=>{let b=null;[.5,1,1.5,2,3].forEach(m=>{const x=m,g=bf-cost({P:df.P-f.P*x,C:df.C-f.C*x,L:df.L-f.L*x});if(!b||g>b.g)b={f,x,g}});if(b&&b.g>.002)out.push(b)});out.sort((a,b)=>b.g-a.g);
 const stale=S.planKcal&&Math.abs(S.planKcal-t.kcal)>20;
 return`<h1>Mes repas</h1><p class="lead">Une proposition calée sur ton objectif. Modifie les quantités, tout se recalcule.</p>
 ${stale?`<div class="banner" style="margin:0 0 16px"><span>Ton objectif a changé (${r(t.kcal)} kcal).</span><button class="btn t" data-act="auto">Mettre à jour la proposition</button></div>`:""}
 <div class="card sum"><div class="ring"><svg width="132" height="132"><circle cx="66" cy="66" r="58" fill="none" stroke="var(--fill)" stroke-width="12"/><circle cx="66" cy="66" r="58" fill="none" stroke="${d.k>t.kcal*1.1?"#ff9500":"var(--blue)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pc/100} ${C}"/></svg><div><b>${r(d.k)}</b>sur ${r(t.kcal)} kcal</div></div>
 <div class="bars">${bars.map(([l,k,tg,c])=>`<div class="bar"><span>${l}<b>${r(d[k])} / ${r(tg)} g</b></span><div class="tr"><i style="width:${Math.min(100,d[k]/tg*100)}%;background:${c}"></i></div></div>`).join("")}</div></div>
 <div class="row" style="margin-top:16px"><button class="btn" data-act="auto">Proposer une journée</button><button class="btn s" data-act="addMeal">Ajouter un repas</button></div>
 ${bf<.01?"":`<h3>Pour mieux équilibrer</h3><div class="card sg">${out.slice(0,3).map(o=>`<div><b>${r(o.f.q*o.x,o.f.q*o.x%1?1:0)} ${o.f.u} de ${esc(o.f.n.toLowerCase())}</b> <span style="color:var(--mute)">· ${o.f.P*o.x>=.5?"+"+r(o.f.P*o.x)+" g prot. ":""}${o.f.C*o.x>=.5?"+"+r(o.f.C*o.x)+" g gluc. ":""}${o.f.L*o.x>=.5?"+"+r(o.f.L*o.x)+" g lip.":""}</span></div>`).join("")||"<div>Rien à ajouter sans déséquilibrer autre chose.</div>"}</div>`}
 ${S.meals.map((m,mi)=>{const x=mealTot(m);return`<h3 style="display:none"></h3><div class="card" style="margin-top:20px"><div class="mh"><input value="${esc(m.n)}" data-mn="${mi}" aria-label="Nom du repas"><button class="btn t" data-dm="${mi}">Supprimer</button></div>
 ${m.i.map((it,ii)=>{const f=find(it[0]);return`<div class="ml"><select data-mf="${mi},${ii}">${S.foods.map(z=>`<option${z.n===it[0]?" selected":""}>${esc(z.n)}</option>`).join("")}</select><input type="number" inputmode="decimal" min="0" step="any" value="${it[1]}" data-ma="${mi},${ii}" aria-label="Quantité"><small>${f?esc(f.u)+" · "+r(kc(f)*it[1]/f.q)+" kcal":""} <button class="btn t" style="font-size:12px;padding:0 6px" data-di="${mi},${ii}">Retirer</button></small></div>`}).join("")}
 <div class="ml"><button class="btn t" data-ai="${mi}" style="text-align:left">+ Ajouter un aliment</button></div>
 <div class="mt"><span><b>${r(x.k)}</b> kcal</span><span><i class="dot" style="background:var(--P)"></i><b>${r(x.P,1)}</b> g</span><span><i class="dot" style="background:var(--C)"></i><b>${r(x.C,1)}</b> g</span><span><i class="dot" style="background:var(--L)"></i><b>${r(x.L,1)}</b> g</span></div></div>`}).join("")}`;
}
function pageAliments(){
 const fld=(i,k,lb,u,col)=>`<div class="item"><label for="f${i}${k}">${lb}</label><span style="display:flex;gap:4px;align-items:center"><input id="f${i}${k}" type="number" inputmode="decimal" min="0" step="any" value="${S.foods[i][k]}" data-f="${i},${k}" style="width:90px${col?";color:"+col:""}"><span style="color:var(--mute)">${u}</span></span></div>`;
 return`<h1>Mes aliments</h1><p class="lead">Touche un aliment pour modifier ses valeurs.</p>
 ${S.foods.map((f,i)=>{const o=openFood===i;return`<div class="card" style="margin-bottom:12px"><button class="fcard" data-of="${i}" aria-expanded="${o}"><span><b>${esc(f.n)}</b><small>${r(f.q,f.q%1?1:0)} ${esc(f.u)} · ${r(kc(f))} kcal</small></span><span class="mm"><i style="color:var(--P)">${r(f.P,1)}</i><i style="color:var(--C)">${r(f.C,1)}</i><i style="color:var(--L)">${r(f.L,1)}</i></span></button>
 ${o?`<div style="border-top:1px solid var(--line)"><div class="item"><label for="fn${i}">Nom</label><input id="fn${i}" value="${esc(f.n)}" data-f="${i},n"></div><div class="item"><label for="fu${i}">Unité</label><input id="fu${i}" value="${esc(f.u)}" data-f="${i},u"></div>${fld(i,"q","Quantité de référence",esc(f.u))}${fld(i,"P","Protéines","g","var(--P)")}${fld(i,"C","Glucides","g","var(--C)")}${fld(i,"L","Lipides","g","var(--L)")}<div class="item"><span>Calories</span><b>${r(kc(f))} kcal</b></div><div class="item"><button class="btn t" style="color:#ff3b30" data-df="${i}">Supprimer cet aliment</button></div></div>`:""}</div>`}).join("")}
 <div class="row"><button class="btn" data-act="addFood">Ajouter un aliment</button><button class="btn s" data-act="reset">Remettre la liste de départ</button></div>
 <p class="note">Les valeurs correspondent à la quantité de référence (100 g, 1 unité…). Les calories se calculent toutes seules.</p>`;
}
function renderChips(){const c=document.getElementById("chips");if(c)c.innerHTML=R.list.map(x=>`<button class="chip${x.id===R.cur?" on":""}" data-pf="${x.id}">${esc(x.name)}</button>`).join("")+`<button class="chip" data-act="newProfile" aria-label="Nouveau profil">+</button>`}
let metric="w";
const MET={w:["Poids","kg"],taille:["Taille","cm"],hanches:["Hanches","cm"],poitrine:["Poitrine","cm"],bras:["Bras","cm"],cuisse:["Cuisse","cm"]};
const fd=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"2-digit"});
const gv=(e,k)=>k==="w"?e.w:(e.m||{})[k];
function chart(){
 const pts=(S.log||[]).map(e=>({t:+new Date(e.d+"T12:00:00"),v:gv(e,metric),d:e.d})).filter(x=>x.v!=null);
 if(pts.length<2)return`<p class="note" style="text-align:center;padding:36px 0">${pts.length?"Ajoute une deuxième mesure pour voir la courbe.":"Aucune mesure pour l'instant."}</p>`;
 const W=640,H=250,pl=48,pr=18,pt=18,pb=32,tg=metric==="w"?S.p.tw:null;
 let lo=Math.min(...pts.map(x=>x.v)),hi=Math.max(...pts.map(x=>x.v));
 if(tg!=null){lo=Math.min(lo,tg);hi=Math.max(hi,tg)}
 const pad=(hi-lo||1)*.18;lo-=pad;hi+=pad;
 const t0=pts[0].t,t1=pts[pts.length-1].t,X=t=>pl+(t1===t0?.5:(t-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 const path=pts.map((x,i)=>(i?"L":"M")+X(x.t).toFixed(1)+" "+Y(x.v).toFixed(1)).join("");
 const tk=[lo+pad,(lo+hi)/2,hi-pad].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${r(v,1)}</text>`).join("");
 const L=pts[pts.length-1];
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe d'évolution">${tk}${tg!=null?`<line x1="${pl}" x2="${W-pr}" y1="${Y(tg)}" y2="${Y(tg)}" stroke="var(--C)" stroke-dasharray="5 5" stroke-width="2"/><text x="${W-pr}" y="${Y(tg)-6}" text-anchor="end" font-size="11" fill="var(--C)">Objectif ${r(tg,1)}</text>`:""}<path d="${path}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(x=>`<circle cx="${X(x.t)}" cy="${Y(x.v)}" r="4.5" fill="var(--card)" stroke="var(--blue)" stroke-width="2.5"/>`).join("")}<text x="${X(L.t)}" y="${Y(L.v)-12}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)">${r(L.v,1)}</text><text x="${pl}" y="${H-8}" font-size="11" fill="var(--mute)">${fd(pts[0].d)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--mute)">${fd(L.d)}</text></svg>`;
}
function pageSuivi(){
 const L=S.log||[],ws=L.filter(e=>e.w!=null),f=ws[0],l=ws[ws.length-1],td=new Date().toISOString().slice(0,10);
 const inp=(id,lb,u,st)=>`<div class="item"><label for="${id}">${lb}</label><span style="display:flex;gap:4px;align-items:center"><input id="${id}" type="number" inputmode="decimal" step="${st}" min="0" style="width:90px" placeholder="—"><span style="color:var(--mute)">${u}</span></span></div>`;
 let sum="";if(f&&l&&f!==l){const dl=l.w-f.w;sum=`Depuis le ${fd(f.d)} : ${dl>0?"+":""}${r(dl,1)} kg. `}
 if(l)sum+=Math.abs(l.w-S.p.tw)<.05?"Objectif atteint, bravo !":`Il te reste ${r(Math.abs(l.w-S.p.tw),1)} kg ${l.w>S.p.tw?"à perdre":"à prendre"} pour atteindre ${r(S.p.tw,1)} kg.`;
 return`<h1>Mon suivi</h1><p class="lead">Note ton poids et tes mensurations pour voir ta progression au fil du temps.</p>
 <div class="card" style="padding:16px 16px 8px"><div class="seg" style="overflow-x:auto;max-width:100%">${Object.entries(MET).map(([k,v])=>`<button data-met="${k}" class="${k===metric?"on":""}">${v[0]}</button>`).join("")}</div>${chart()}</div>
 <p class="note">${sum||"Ajoute ta première mesure ci-dessous."}</p>
 <h3>Nouvelle mesure</h3><div class="card"><div class="item"><label for="s_d">Date</label><input id="s_d" type="date" value="${td}" style="width:auto"></div>${inp("s_w","Poids","kg",.1)}${inp("s_taille","Tour de taille","cm",.5)}${inp("s_hanches","Tour de hanches","cm",.5)}${inp("s_poitrine","Tour de poitrine","cm",.5)}${inp("s_bras","Tour de bras","cm",.5)}${inp("s_cuisse","Tour de cuisse","cm",.5)}</div>
 <p class="note">Remplis ce que tu veux, le reste est facultatif. Un nouveau poids met à jour ton poids actuel, et tes besoins se recalculent.</p>
 <div class="row"><button class="btn" data-act="saveLog">Enregistrer</button></div>
 ${L.length?`<h3>Historique</h3><div class="card">${L.map((e,i)=>[e,i]).reverse().map(([e,i])=>`<div class="item"><span><b>${fd(e.d)}</b><br><span style="color:var(--mute);font-size:13px">${[e.w!=null?r(e.w,1)+" kg":"",...Object.entries(e.m||{}).map(([k,v])=>MET[k][0].toLowerCase()+" "+r(v,1))].filter(Boolean).join(" · ")}</span></span><button class="btn t" data-dl="${i}">Supprimer</button></div>`).join("")}</div>`:""}`;
}
const PAGES={profil:pageProfil,repas:pageRepas,suivi:pageSuivi,aliments:pageAliments};
let page="profil";
function render(keep){
 const sy=scrollY;
 page=(location.hash||"#profil").slice(1);if(!PAGES[page])page="profil";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.pg===page));
 document.getElementById("app").innerHTML=PAGES[page]()+'<p class="note" style="text-align:center;margin-top:40px">Estimations indicatives, qui ne remplacent pas un avis médical.</p>';renderChips();
 if(keep)scrollTo(0,sy);else scrollTo(0,0);
}
const upd=()=>{save();render(true)};
addEventListener("hashchange",()=>render(false));
const uid=()=>"p"+Date.now().toString(36)+Math.floor(Math.random()*1e4);
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset&&t.dataset.pname!==undefined){cur().name=(t.value||"").trim().slice(0,30)||"Profil";save();renderChips()}
 if(t.id==="imp"&&t.files&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const L=(j.profiles||[]).filter(x=>x&&x.S&&x.S.p&&Array.isArray(x.S.foods)&&Array.isArray(x.S.meals));if(!L.length)throw 0;L.forEach(x=>R.list.push({id:uid(),name:String(x.name||"Importé").slice(0,30),S:x.S}));setCur(R.list[R.list.length-L.length].id);save();render(false);alert(L.length+" profil(s) importé(s).")}catch(_){alert("Ce fichier n'est pas valide.")}t.value=""};rd.readAsText(t.files[0])}
});
(function(){let drag=null;
const val=(el,x)=>{const b=el.getBoundingClientRect();return Math.round(10+Math.min(1,Math.max(0,(x-b.left)/b.width))*10)};
const show=(el,v)=>{el.style.setProperty("--pct",(v-10)*10+"%");el.setAttribute("aria-valuenow",v);const l=document.getElementById("defv");if(l)l.textContent=v+" %"};
document.addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest(".ios");if(!el)return;drag=el;try{el.setPointerCapture(e.pointerId)}catch(_){}show(el,val(el,e.clientX))});
document.addEventListener("pointermove",e=>{if(drag)show(drag,val(drag,e.clientX))});
document.addEventListener("pointerup",e=>{if(!drag)return;const v=val(drag,e.clientX);drag=null;S.p.def=v;upd()});
document.addEventListener("pointercancel",()=>{if(drag){drag=null;render(true)}});
document.addEventListener("keydown",e=>{const el=e.target.closest&&e.target.closest(".ios");if(!el)return;const d=(e.key==="ArrowRight"||e.key==="ArrowUp")?1:(e.key==="ArrowLeft"||e.key==="ArrowDown")?-1:0;if(d){e.preventDefault();S.p.def=Math.min(20,Math.max(10,S.p.def+d));upd()}});
})();
document.addEventListener("change",e=>{
 const d=e.target.dataset,v=e.target.value;
 if(d.p){S.p[d.p]=d.p==="sex"?v:d.p==="def"?Math.min(20,Math.max(10,+v||10)):+v;upd()}
 else if(d.mn!==undefined){S.meals[d.mn].n=v;save()}
 else if(d.mf){const[a,b]=d.mf.split(",");S.meals[a].i[b][0]=v;upd()}
 else if(d.ma){const[a,b]=d.ma.split(",");S.meals[a].i[b][1]=Math.max(0,+v||0);upd()}
 else if(d.f){const[i,k]=d.f.split(","),f=S.foods[i];
  if(k==="n"){const o=f.n,nv=v||o;S.meals.forEach(m=>m.i.forEach(it=>{if(it[0]===o)it[0]=nv}));f.n=nv}
  else if(k==="u")f.u=v;else f[k]=k==="q"?Math.max(.01,+v||1):Math.max(0,+v||0);if(f.auto)f.cat=guess(f);upd()}
});
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.seg){S.p[d.seg]=d.v;upd()}
 else if(d.of!==undefined){openFood=openFood===+d.of?null:+d.of;render(true)}
 else if(d.pf){setCur(d.pf);save();render(true)}
 else if(d.met){metric=d.met;render(true)}
 else if(d.dl!==undefined){S.log.splice(+d.dl,1);upd()}
 else if(d.act==="saveLog"){const g=id=>{const v=parseFloat(String(document.getElementById(id).value).replace(",","."));return isNaN(v)||v<=0?null:v};
  const dt=document.getElementById("s_d").value;if(!dt)return;const w=g("s_w"),m={};["taille","hanches","poitrine","bras","cuisse"].forEach(k=>{const v=g("s_"+k);if(v!=null)m[k]=v});
  if(w==null&&!Object.keys(m).length){alert("Renseigne au moins une valeur.");return}
  S.log=S.log||[];const ex=S.log.find(e=>e.d===dt),e=ex||{d:dt};if(w!=null)e.w=w;e.m=Object.assign(e.m||{},m);if(!ex)S.log.push(e);
  S.log.sort((a,b)=>a.d<b.d?-1:1);const lw=[...S.log].reverse().find(e=>e.w!=null);if(lw)S.p.w=lw.w;upd()}
 else if(d.act==="newProfile"){const n=prompt("Nom du nouveau profil ?");if(n&&n.trim()){const x={id:uid(),name:n.trim().slice(0,30),S:clone(DEF)};R.list.push(x);setCur(x.id);auto();save();location.hash="#profil";render(false)}}
 else if(d.act==="delProfile"){if(R.list.length>1&&confirm("Supprimer le profil « "+cur().name+" » et ses données ?")){R.list=R.list.filter(z=>z.id!==R.cur);setCur(R.list[0].id);save();render(false)}}
 else if(d.act==="export"){const bl=new Blob([JSON.stringify({app:"plan-alimentaire",v:3,profiles:R.list.map(x=>({name:x.name,S:x.S}))},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="plan-alimentaire-sauvegarde.json";document.body.appendChild(a);a.click();a.remove()}
 else if(d.act==="import"){document.getElementById("imp").click()}
 else if(d.act==="auto"){auto();render(true)}
 else if(d.act==="addMeal"){S.meals.push({n:"Nouveau repas",i:[]});upd()}
 else if(d.act==="addFood"){S.foods.push({n:"Nouvel aliment "+(S.foods.length+1),u:"g",q:100,P:0,C:0,L:0,cat:"Autres",auto:true});openFood=S.foods.length-1;upd()}
 else if(d.act==="reset"){if(confirm("Remettre la liste d'aliments de départ ?")){const p=S.p;S=JSON.parse(JSON.stringify(DEF));S.p=p;cur().S=S;auto();render(true)}}
 else if(d.dm!==undefined){S.meals.splice(d.dm,1);upd()}
 else if(d.di){const[a,i]=d.di.split(",");S.meals[a].i.splice(i,1);upd()}
 else if(d.ai!==undefined&&S.foods.length){S.meals[d.ai].i.push([S.foods[0].n,S.foods[0].q]);upd()}
 else if(d.df!==undefined){openFood=null;const n=S.foods[d.df].n;S.foods.splice(d.df,1);S.meals.forEach(m=>m.i=m.i.filter(it=>it[0]!==n));upd()}
});
render(false);
</script>
